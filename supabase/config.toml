# Configuración mínima para desplegar con la CLI de Supabase.
project_id = "bot-obra-los-andes"

[functions.telegram]
# Telegram no manda JWT: la función verifica X-Telegram-Bot-Api-Secret-Token.
verify_jwt = false

[functions.programado]
# La llama pg_cron con pg_net: la función verifica X-Programado-Secret (guardado en Vault).
verify_jwt = false

[functions.tablero]
# La llama el Apps Script del tablero (y el navegador, para las fotos): la función verifica el código del enlace.
verify_jwt = false

[edge_runtime]
# Solo para pruebas locales: deja terminar las tareas en segundo plano.
policy = "per_worker"
